<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">DSH Strong Skills — More capable. Less context.</title>
  <desc id="desc">A lightweight DeepSeek Harness companion: universal coding enhancements, dedicated DeepSeek strategies, eight on-demand skills and four bounded tools.</desc>
